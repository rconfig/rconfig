name: Build and push Docker image

on:
  push:
    tags:
      # Release tags follow the repo convention: core-X.Y.Z (see CLAUDE.md).
      - 'core-*'

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: docker.io/rconfig/rconfig
  GHCR_IMAGE: ghcr.io/rconfig/rconfig

jobs:
  # Guard the release before anything expensive runs. The image version is
  # derived from the git tag, so a tag pushed without bumping the in-repo
  # version ships an image whose reported version disagrees with its tag. This
  # has happened: core-8.2.13 was tagged with VERSION still reading 8.2.12.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assert tag matches in-repo version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF#refs/tags/core-}"
          # Pre-release tags (core-8.2.7-rc.1) carry the base version in-repo.
          base_version="${tag_version%%-*}"

          composer_version="$(jq -r '.version' composer.json)"
          config_version="$(sed -n "s/.*'version'[[:space:]]*=>[[:space:]]*'\([^']*\)'.*/\1/p" config/app.php | head -1)"
          file_version="$(tr -d '[:space:]' < VERSION)"

          echo "tag:            ${tag_version} (base ${base_version})"
          echo "composer.json:  ${composer_version}"
          echo "config/app.php: ${config_version}"
          echo "VERSION:        ${file_version}"

          status=0
          for pair in "composer.json:${composer_version}" "config/app.php:${config_version}" "VERSION:${file_version}"; do
            source_name="${pair%%:*}"
            source_version="${pair#*:}"
            if [[ "${source_version}" != "${base_version}" ]]; then
              echo "::error file=${source_name}::${source_name} is ${source_version}, expected ${base_version} to match tag ${tag_version}"
              status=1
            fi
          done

          if [[ "${status}" -ne 0 ]]; then
            echo "Release aborted. Bump VERSION, composer.json and config/app.php to ${base_version}, then re-tag."
            exit 1
          fi

          echo "All version sources agree with the tag."

  # Each architecture builds on a runner of its own architecture, so nothing is
  # emulated. The previous single-runner linux/amd64,linux/arm64 build ran the
  # arm64 half under QEMU, where compiling the PHP extensions dominated the run
  # (measured: 2919s of a 2945s build). The two jobs here also run in parallel,
  # so wall clock is the slower of the two rather than the sum.
  #
  # Each job pushes an untagged, digest-addressed image. The merge job below
  # assembles those digests into the tagged manifest lists.
  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            # Free for public repositories. No QEMU needed.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          # Registry cache rather than type=gha. The GitHub Actions cache evicts
          # entries that go untouched for 7 days, and releases are further apart
          # than that, so the old cache-from never hit and every release rebuilt
          # the whole image from scratch. A registry ref does not expire.
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-architecture digests into one tagged manifest list per
  # registry. Tag selection is unchanged from the previous workflow.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: run
        run: |
          # Strip the core- prefix: core-8.2.7 -> 8.2.7, core-8.2.7-rc.1 -> 8.2.7-rc.1
          version="${GITHUB_REF#refs/tags/core-}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then
            # Pre-release (suffix after the semver, e.g. -rc.1): publish the
            # exact version only, never the rolling major/minor/latest tags.
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
            echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # Take full control of the latest tag below rather than the auto flavour.
          flavor: |
            latest=false
          tags: |
            # Exact version on every release tag, including pre-releases.
            type=raw,value=${{ steps.run.outputs.version }}
            # Rolling minor / major / latest only for stable (non pre-release) tags.
            type=raw,value=${{ steps.run.outputs.minor }},enable=${{ steps.run.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ steps.run.outputs.major }},enable=${{ steps.run.outputs.is_prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.run.outputs.is_prerelease == 'false' }}

      - name: Create manifest lists and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          digest_count=$(find . -type f | wc -l)
          if [ "$digest_count" -eq 0 ]; then
            echo 'No digests were downloaded from the build jobs.' >&2
            exit 1
          fi
          echo "Assembling ${digest_count} architecture digests."

          for image in "${DOCKERHUB_IMAGE}" "${GHCR_IMAGE}"; do
            # Select only the tags belonging to this registry, then point them
            # at the per-architecture digests pushed by the build jobs.
            tag_args=$(jq -cr --arg image "$image" \
              '.tags | map(select(startswith($image + ":")) | "-t " + .) | join(" ")' \
              <<< "$DOCKER_METADATA_OUTPUT_JSON")

            if [ -z "$tag_args" ]; then
              echo "No tags resolved for ${image}" >&2
              exit 1
            fi

            # shellcheck disable=SC2086
            docker buildx imagetools create $tag_args \
              $(printf "${image}@sha256:%s " *)
          done

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${{ steps.run.outputs.version }}"
