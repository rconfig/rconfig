name: Build and push Docker image

on:
  push:
    tags:
      # Release tags follow the repo convention: core-X.Y.Z (see CLAUDE.md).
      - 'core-*'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine version
        id: run
        run: |
          # Strip the core- prefix: core-8.2.7 -> 8.2.7, core-8.2.7-rc.1 -> 8.2.7-rc.1
          version="${GITHUB_REF#refs/tags/core-}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then
            # Pre-release (suffix after the semver, e.g. -rc.1): publish the
            # exact version only, never the rolling major/minor/latest tags.
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
            echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            rconfig/rconfig
            ghcr.io/rconfig/rconfig
          # Take full control of the latest tag below rather than the auto flavour.
          flavor: |
            latest=false
          tags: |
            # Exact version on every release tag, including pre-releases.
            type=raw,value=${{ steps.run.outputs.version }}
            # Rolling minor / major / latest only for stable (non pre-release) tags.
            type=raw,value=${{ steps.run.outputs.minor }},enable=${{ steps.run.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ steps.run.outputs.major }},enable=${{ steps.run.outputs.is_prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.run.outputs.is_prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Fixed scope so consecutive release builds share the layer cache
          # instead of each tag ref starting cold.
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
