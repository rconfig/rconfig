name: CI

on:
  pull_request:

# Least privilege: these jobs only read the repo, never write back.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. rapid pushes, or push + PR on the same branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# composer install runs package:discover, which boots the framework and loads the
# route files. Those resolve paths from APP_DIR_PATH, whose default is the production
# deploy path (/var/www/html/rconfig8/current). On a runner the repo lives in the
# workspace, so point it there or the route requires fail with "No such file".
env:
  APP_DIR_PATH: ${{ github.workspace }}

jobs:
  pint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        # actions/checkout v6.0.2 (runs on Node 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup PHP
        # shivammathur/setup-php v2.37.1
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          # Only the hard-required extensions not already bundled in the base PHP build.
          php-version: '8.4'
          extensions: ftp, gd, ldap, sockets
          coverage: none

      - name: Prepare .env
        run: cp .env.example .env

      - name: Use SQLite for framework boot
        run: |
          touch "${{ github.workspace }}/database/database.sqlite"
          {
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite"
          } >> .env

      - name: Install Composer dependencies
        # ramsey/composer-install v4.0.0 (uses actions/cache v5, runs on Node 24)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda

      - name: Run Pint
        run: vendor/bin/pint --test

  phpstan:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        # actions/checkout v6.0.2 (runs on Node 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup PHP
        # shivammathur/setup-php v2.37.1
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          # Only the hard-required extensions not already bundled in the base PHP build.
          php-version: '8.4'
          extensions: ftp, gd, ldap, sockets
          coverage: none

      - name: Prepare .env
        run: cp .env.example .env

      - name: Use SQLite for framework boot
        run: |
          touch "${{ github.workspace }}/database/database.sqlite"
          {
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite"
          } >> .env

      - name: Install Composer dependencies
        # ramsey/composer-install v4.0.0 (uses actions/cache v5, runs on Node 24)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda

      - name: Cache PHPStan result cache
        # actions/cache v5.0.5 (runs on Node 24)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .phpstan
          # Save a fresh cache per commit; fall back to the most recent prior run for incremental reuse.
          key: phpstan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ runner.os }}-

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=-1 --error-format=github

  eslint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        # actions/checkout v6.0.2 (runs on Node 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          # Pinned to the current LTS
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  vitest:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        # actions/checkout v6.0.2 (runs on Node 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          # Pinned to the current LTS
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  tests:
    name: Tests (Unit + Fasttests)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Forces custom_chown()'s suppressed-vs-loud branch (app/Http/Helpers.php) for
      # every step in this job, not just the phpunit-invoked test run — the runner
      # user can't chown() to apache/www-data (needs CAP_CHOWN), and that's expected
      # here, not a real deployment problem worth failing loudly over.
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: v8core_test
      DB_USERNAME: root
      DB_PASSWORD: ""
      TEST_DB_MYSQL_HOST: 127.0.0.1
      TEST_DB_MYSQL_PORT: 3306
      TEST_DB_MYSQL_DATABASE: v8core_test
      TEST_DB_MYSQL_USERNAME: root
      TEST_DB_MYSQL_PASSWORD: ""
      # Read by config/database.php's 'redis' connection (predis client).
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: v8core_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.4'
          extensions: ftp, gd, ldap, sockets, pdo_mysql
          coverage: none

      - name: Prepare .env.testing
        # tests/CreatesApplication.php forces .env.testing for every Unit/Fasttests
        # test regardless of APP_ENV, and it's gitignored (developer-machine-only),
        # so CI has to create its own throwaway copy rather than relying on plain .env.
        run: cp .env.example .env.testing

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda

      - name: Generate app key
        # APP_ENV=testing (job env, above) + .env.testing already existing means
        # Laravel's normal bootstrap resolves .env.testing as the target file here,
        # matching the file tests/CreatesApplication.php force-loads for every test.
        run: php artisan key:generate --force

      - name: Run Unit + Fasttests
        run: php artisan test --compact tests/Unit tests/Fasttests --exclude-group=device-hardware --exclude-group=external-network --exclude-group=local-daemon