; Horizon rConfig Configuration
; This is a stub. setup_supervisor.sh fills in the web user and app folder and
; writes the result into the Supervisor config folder as a root owned file
; named rconfig-core-horizon.ini (RHEL) or rconfig-core-horizon.conf (Ubuntu).
; Never symlink this file into /etc, and never set the user to root. The
; program name is CORE specific so it cannot clash with rConfig PRO's horizon.
[program:rconfig-core-horizon]
process_name=%(program_name)s
command=php RCONFIG_APP_DIR/artisan horizon
autostart=true
autorestart=true
user=RCONFIG_WEB_USER
redirect_stderr=true
stdout_logfile=RCONFIG_APP_DIR/storage/logs/horizon.log
stopwaitsecs=3600
