; Horizon rConfig Configuration
; This is a stub. setup_supervisor.sh fills in the web user and app folder and
; writes the result into the Supervisor config folder as a root owned file
; named rconfig-core-horizon.ini (RHEL) or rconfig-core-horizon.conf (Ubuntu).
; Never symlink this file into /etc, and never set the user to root. The
; program name is CORE specific so it cannot clash with rConfig PRO's horizon.
; Horizon writes its own log to storage/logs/horizon.log. The shell opens the
; file after Supervisor has switched to the web user, so the log is owned by
; the web user, and exec hands the shell's process to PHP so Supervisor's stop
; signal reaches Horizon. supervisord runs as root, so its own log files go to
; /dev/null and it never opens a file in the app folder.
[program:rconfig-core-horizon]
process_name=%(program_name)s
command=/bin/sh -c 'exec php RCONFIG_APP_DIR/artisan horizon >> RCONFIG_APP_DIR/storage/logs/horizon.log 2>&1'
autostart=true
autorestart=true
user=RCONFIG_WEB_USER
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
stopwaitsecs=3600
